# Deep Thought API - Docker Compose
#
# Usage:
#   1. Copy .env.example to .env and add your wallet address
#   2. Run: docker-compose -f deploy/docker/docker-compose.yml up

services:
  deep-thought-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      - PORT=3000
      - FACILITATOR_URL=${FACILITATOR_URL:-https://gateway.kobaru.io}
      - SOLANA_WALLET_ADDRESS=${SOLANA_WALLET_ADDRESS}
      - BASE_WALLET_ADDRESS=${BASE_WALLET_ADDRESS}
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
