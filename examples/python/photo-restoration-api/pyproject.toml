# Photo Restoration API - Modern Python Project Configuration
# This file is optional but recommended for modern Python tooling

[project]
name = "photo-restoration-api"
version = "1.0.0"
description = "AI-powered photo restoration API with x402 payments on SKALE"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "API Paywall Cookbook", email = "noreply@kobaru.io"}
]
keywords = ["x402", "payments", "skale", "photo-restoration", "ai", "opencv", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "x402[fastapi,evm]>=2.0.0",
    "opencv-python>=4.10.0",
    "Pillow>=10.4.0",
    "numpy>=1.26.0",
    "google-genai>=1.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.10.0",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.27.0",  # For testing FastAPI
]

[project.urls]
Homepage = "https://github.com/kobaru-io/api-paywall-cookbook"
Documentation = "https://docs.kobaru.io"
Repository = "https://github.com/kobaru-io/api-paywall-cookbook"
"Bug Tracker" = "https://github.com/kobaru-io/api-paywall-cookbook/issues"

[project.scripts]
photo-restoration-api = "deploy.standalone.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Black (code formatter) configuration
[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

# isort (import sorter) configuration
[tool.isort]
profile = "black"
line_length = 100

# mypy (type checker) configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

# pytest configuration
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
