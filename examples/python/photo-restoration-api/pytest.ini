[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Enable strict markers
    --strict-markers
    # Coverage reporting (optional, requires pytest-cov)
    # --cov=src
    # --cov-report=html
    # --cov-report=term-missing

# Markers (used with @pytest.mark.marker_name)
markers =
    unit: Unit tests for individual components
    integration: Integration tests for end-to-end functionality
    slow: Tests that take a long time to run
    opencv: Tests that require OpenCV functionality
    gemini: Tests that interact with Gemini API (mocked)
    payment: Tests for x402 payment flow

# Asyncio mode (required for async tests)
asyncio_mode = auto

# Minimum Python version
minversion = 6.0

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
